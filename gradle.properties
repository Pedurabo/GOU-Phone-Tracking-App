org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# --- Windows-safe Gradle hardening (reduce file locking) ---
# Daemon left enabled (default); use --no-daemon only if you hit persistent lock issues.
# Disable parallel execution: on Windows, parallel tasks often lock the same outputs (e.g. JARs)
# and cause "file in use" or "could not delete" errors; single-threaded builds avoid contention.
org.gradle.parallel=false
# Disable configuration cache: on Windows the cache can be locked or corrupted (Gradle 9.x);
# re-running configuration each time avoids lock/corruption issues.
org.gradle.configuration.cache=false
# Single worker: prevents multiple processes from holding JARs/outputs open and reduces file locking.
org.gradle.workers.max=1
# Disable VFS watching: on Windows (NTFS/network drives) file watchers can lock build dirs.
org.gradle.vfs.watch=false
# ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official
# Removed deprecated options (AGP 9 defaults): resvalues, defaultTargetSdkToCompileSdkIfUnset,
# enableAppCompileTimeRClass, usesSdkInManifest.disallowed, r8.optimizedResourceShrinking,
# builtInKotlin, newDsl. Re-add in gradle.properties if you need to override.
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
# Disable incremental kapt to reduce Kotlin 2.2 metadata parsing issues (Room/Hilt)
kapt.incremental=false
# Override API base URLs for development (PC WiFi IP from ipconfig).
# Emulator: use http://10.0.2.2:8080/
API_BASE_URL=http://192.168.100.4:8080/
AUTH_BASE_URL=http://192.168.100.4:8080/
# Auth login path (must match your backend). If 404, try: login | api/login | api/auth/login | api/v1/login
AUTH_TOKEN_PATH=login

# Kotlin incremental caches are disabled to avoid corruption under Kotlin 2.x + Gradle 9.
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.compiler.execution.strategy=in-process
